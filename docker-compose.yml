version: '3.8'

services:
  # Campus Navigation Flask Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus_nav_web
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - APP_ENV=development
      - FLASK_DEBUG=1
      - PORT=8080
      - SECRET_KEY=local-dev-secret-key-campus-nav-2026
      - RATELIMIT_STORAGE_URI=memory://
